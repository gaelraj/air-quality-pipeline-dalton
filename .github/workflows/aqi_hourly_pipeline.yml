name: AQI Hourly Pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aqi-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-aqi-hourly-pipeline:
    runs-on: ubuntu-latest

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --rebase origin "$GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect current raw data
        run: python scripts/collect_current.py

      - name: Rebuild clean CSV
        run: python scripts/rebuild_clean.py

      - name: Validate clean CSV
        run: python scripts/validate_clean.py

      - name: Create warehouse schema
        run: python scripts/run_schema.py

      - name: Load warehouse
        run: python scripts/load_warehouse.py

      - name: Commit generated raw and clean data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw data/clean
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: collect AQI data [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
